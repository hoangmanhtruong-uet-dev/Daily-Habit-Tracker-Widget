name: Widget RAM spike

# Đo RAM/CPU của WidgetHost phương án WPF (SPEC-V2-05). Chạy tay hoặc khi đẩy lên nhánh spike/**.
on:
  workflow_dispatch:
  push:
    branches: ['spike/**']

jobs:
  measure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build spike (Release)
        run: dotnet build tools/WidgetHostSpike -c Release
      - name: Measure 0, 1, 3, 6 widgets and 3 with trim
        shell: pwsh
        run: |
          $exe = Get-ChildItem tools/WidgetHostSpike/bin -Recurse -Filter WidgetHostSpike.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path spike-out | Out-Null
          foreach ($cfg in @(@(0,''), @(1,''), @(3,''), @(6,''), @(3,'trim'))) {
            $n = $cfg[0]; $mode = $cfg[1]
            $out = Join-Path (Get-Location) "spike-out/widgets-$n$mode.md"
            $p = Start-Process $exe.FullName -ArgumentList "$n", "70", $out, "Large", $(if ($mode) { $mode } else { "none" }) -PassThru
            if (-not $p.WaitForExit(150000)) { $p.Kill(); Write-Error "spike $n timed out"; exit 1 }
            Get-Content $out | Select-Object -First 9
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-spike
          path: spike-out/*.md
