name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore HabitGrid.sln
      - name: Build
        run: dotnet build HabitGrid.sln -c Release --no-restore
      - name: Test
        run: dotnet test HabitGrid.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      - name: Vulnerable packages
        shell: bash
        run: |
          out=$(dotnet list HabitGrid.sln package --vulnerable --include-transitive 2>&1)
          echo "$out"
          if echo "$out" | grep -q "has the following vulnerable packages"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/test-results.trx"
